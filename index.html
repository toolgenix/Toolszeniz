<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolszenix — All-in-One Free Online Tools for Daily Use</title>
<meta name="description" content="Toolszenix is a free online tools directory with 240 tools for PDF, images, text, students, developers, designers, creators and everyday tasks.">
<meta name="theme-color" content="#3478F6">
<style>
:root{
  --primary:#3478F6; --primary-hover:#2563EB; --accent:#7958F5;
  --page-bg:#EEF5FF; --surface:#FFFFFF; --text-primary:#172033; --text-secondary:#64748B;
  --border:#E3EAF5; --success:#16A779; --footer-bg:#0F172A;
  --radius-card:16px; --radius-button:12px;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
  --shadow-sm:0 1px 2px rgba(15,23,42,.05), 0 2px 8px rgba(15,23,42,.04);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--page-bg);color:var(--text-primary);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:16px}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.22;letter-spacing:-.02em}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--text-secondary)}
.small{font-size:13.5px}
.center{text-align:center}
section{padding:8px 0}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:12px;z-index:200;background:#fff;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow)}

/* ---------- NAV ---------- */
.nav{position:sticky;top:0;z-index:80;background:#fff;border-bottom:1px solid var(--border)}
.nav-in{max-width:1200px;margin:0 auto;padding:0 20px;height:66px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.03em;flex:0 0 auto}
.logo-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800}
.nav-links{display:flex;gap:2px;align-items:center}
.nav-links a,.nav-links button{padding:8px 12px;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--text-secondary);
  background:none;border:0;display:inline-flex;align-items:center;gap:5px}
.nav-links a:hover,.nav-links button:hover{background:#EFF5FF;color:var(--primary)}
.nav-links a.active{background:#EFF5FF;color:var(--primary)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.nav-search{position:relative}
.nav-search input{width:210px;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:10px;
  background:#F7FAFF;font-size:14px;outline:none;color:var(--text-primary)}
.nav-search input:focus{border-color:var(--primary);background:#fff}
.nav-search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.55}
.suggest{position:absolute;top:calc(100% + 8px);left:0;width:340px;max-height:340px;overflow:auto;background:#fff;
  border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:none}
.suggest.open{display:block}
.suggest a{display:flex;gap:10px;padding:9px 10px;border-radius:10px;align-items:center}
.suggest a:hover{background:#F3F8FF}
.suggest .si2{width:30px;height:30px;border-radius:9px;background:#EFF5FF;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.suggest .sn{font-size:14px;font-weight:650}
.suggest .sc{font-size:12px;color:var(--text-secondary)}
.dropdown{position:absolute;top:calc(100% + 8px);left:0;background:#fff;border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:8px;display:none;min-width:280px;z-index:90;grid-template-columns:1fr 1fr;gap:2px}
.dropdown.open{display:grid}
.dropdown a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--text-primary)}
.dropdown a:hover{background:#F3F8FF;color:var(--primary)}
.nav-item{position:relative}
.hamburger{display:none;background:none;border:1px solid var(--border);border-radius:10px;padding:7px 11px;font-size:17px}
.mobile-panel{display:none;border-top:1px solid var(--border);background:#fff;padding:12px 20px 18px}
.mobile-panel.open{display:block}
.mobile-panel a{display:block;padding:11px 8px;border-radius:10px;font-weight:600;color:var(--text-secondary)}
.mobile-panel a:hover{background:#F3F8FF;color:var(--primary)}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--radius-button);
  border:1px solid transparent;font-weight:650;font-size:14.5px;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(52,120,246,.25)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:#fff;color:var(--text-primary);border-color:var(--border)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-soft{background:#EFF5FF;color:var(--primary)}
.btn-soft:hover{background:#E2EDFF}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--primary);outline-offset:2px}

/* ---------- HERO ---------- */
.hero{padding:56px 0 34px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);color:var(--primary);
  font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:7px 14px;border-radius:999px;box-shadow:var(--shadow-sm)}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block}
.hero h1{font-size:46px;margin:18px 0 14px;font-weight:800}
.hero h1 .hl{color:var(--primary)}
.hero p.lead{font-size:17.5px;color:var(--text-secondary);max-width:520px}
.hero-actions{display:flex;gap:12px;margin:26px 0 22px;flex-wrap:wrap}
.benefits{display:flex;gap:20px;flex-wrap:wrap}
.benefit{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:650;color:var(--text-secondary)}
.benefit .tick{width:20px;height:20px;border-radius:6px;background:#E4F6EF;color:var(--success);display:grid;place-items:center;font-size:11px;font-weight:800}

.hero-art{position:relative;height:390px}
.hero-circle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:168px;height:168px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:grid;place-items:center;text-align:center;
  box-shadow:0 22px 50px rgba(52,120,246,.34);z-index:3}
.hero-circle b{display:block;font-size:30px;font-weight:800;line-height:1}
.hero-circle span{font-size:12px;letter-spacing:.16em;font-weight:700;opacity:.9}
.float-card{position:absolute;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 15px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-weight:650;font-size:14px;z-index:2}
.float-card .fi{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:16px}
.fc1{top:6%;left:2%} .fc2{top:16%;right:0%} .fc3{bottom:16%;left:0%} .fc4{bottom:5%;right:4%}
.hero-art::after{content:"";position:absolute;inset:8% 4%;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(52,120,246,.13),rgba(121,88,245,.05) 60%,transparent 72%);z-index:1}

/* ---------- SECTIONS ---------- */
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.sec-head h2{font-size:27px;font-weight:800}
.sec-head p{color:var(--text-secondary);font-size:15px;margin-top:6px}
.section-pad{padding:44px 0}

/* ---------- GRIDS ---------- */
.grid-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

/* ---------- TOOL CARD ---------- */
.tool-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:18px;
  display:flex;flex-direction:column;gap:11px;transition:.16s;box-shadow:var(--shadow-sm);height:100%}
.tool-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#CFE0FB}
.tc-top{display:flex;align-items:center;gap:11px}
.tc-ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:0 0 auto;background:#EFF5FF}
.tc-name{font-size:15px;font-weight:700;line-height:1.3}
.tc-desc{font-size:13.5px;color:var(--text-secondary);flex:1}
.tc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.tc-cat{font-size:11.5px;font-weight:700;color:var(--text-secondary);background:#F4F7FC;padding:4px 9px;border-radius:7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.tc-open{font-size:13px;font-weight:700;color:var(--primary);display:inline-flex;align-items:center;gap:5px}
.tool-card:hover .tc-open{gap:8px}

/* ---------- CATEGORY CARD ---------- */
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:20px;
  display:flex;flex-direction:column;gap:10px;transition:.16s;box-shadow:var(--shadow-sm)}
.cat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#CFE0FB}
.cat-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px}
.cat-name{font-size:15.5px;font-weight:750}
.cat-count{font-size:13px;color:var(--text-secondary)}
.cat-go{font-size:13px;font-weight:700;color:var(--primary);margin-top:auto}

/* ---------- GENERIC CARD ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:22px;box-shadow:var(--shadow-sm)}
.card h3{font-size:16.5px;font-weight:750;margin-bottom:7px}
.card p{font-size:14px;color:var(--text-secondary)}
.step-num{width:34px;height:34px;border-radius:10px;background:#EFF5FF;color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:15px;margin-bottom:12px}
.feat-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;margin-bottom:12px;background:#EFF5FF}

/* ---------- CTA ---------- */
.cta{background:linear-gradient(115deg,var(--primary),var(--accent));border-radius:22px;padding:46px 40px;color:#fff;
  display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}
.cta h2{font-size:29px;font-weight:800}
.cta p{opacity:.92;margin-top:8px;font-size:15.5px;max-width:520px}
.cta .btn-ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.34)}
.cta .btn-ghost:hover{background:rgba(255,255,255,.24);color:#fff}
.cta .btn-white{background:#fff;color:var(--primary)}
.cta .btn-white:hover{background:#F1F6FF}

/* ---------- ACCORDION ---------- */
.accordion{display:flex;flex-direction:column;gap:10px;max-width:860px;margin:0 auto}
.acc-item{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.acc-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 18px;
  background:none;border:0;text-align:left;font-weight:650;font-size:15px;color:var(--text-primary)}
.acc-ico{font-size:19px;color:var(--primary);font-weight:700;flex:0 0 auto}
.acc-body{display:none;padding:0 18px 17px}
.acc-item.open .acc-body{display:block}
.acc-body p{font-size:14.3px;color:var(--text-secondary)}

/* ---------- FOOTER ---------- */
footer{background:var(--footer-bg);color:#C7D2E4;margin-top:60px;padding:52px 0 26px}
.f-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:34px}
footer h4{color:#fff;font-size:14px;font-weight:750;margin-bottom:14px;letter-spacing:.02em}
footer a{display:block;padding:5px 0;font-size:13.8px;color:#C7D2E4}
footer a:hover{color:#fff}
footer .flogo{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:19px;margin-bottom:12px}
footer p{font-size:13.8px;color:#93A2BB;max-width:320px}
.f-bottom{border-top:1px solid rgba(255,255,255,.09);margin-top:34px;padding-top:20px;display:flex;
  justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:13px;color:#8494AE}

/* ---------- DIRECTORY ---------- */
.page-head{padding:34px 0 22px}
.page-head h1{font-size:32px;font-weight:800}
.page-head p{color:var(--text-secondary);margin-top:8px;font-size:15.5px}
.toolbar{background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:16px;
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;box-shadow:var(--shadow-sm);margin-bottom:22px}
.toolbar input[type=search],.toolbar select{padding:10px 13px;border:1px solid var(--border);border-radius:10px;font-size:14px;
  outline:none;background:#F7FAFF;color:var(--text-primary)}
.toolbar input[type=search]{flex:1;min-width:200px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--primary);background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--border);font-size:13px;font-weight:650;
  color:var(--text-secondary)}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.result-count{font-size:13.5px;color:var(--text-secondary);margin-bottom:14px;font-weight:600}
.empty{background:#fff;border:1px dashed var(--border);border-radius:var(--radius-card);padding:46px 20px;text-align:center}
.empty h3{font-size:18px;margin-bottom:8px}
.empty p{color:var(--text-secondary);font-size:14.5px}

/* ---------- TOOL PAGE ---------- */
.crumbs{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--text-secondary);padding:22px 0 0;flex-wrap:wrap}
.crumbs a:hover{color:var(--primary)}
.tool-hero{display:flex;gap:18px;align-items:flex-start;padding:18px 0 24px;flex-wrap:wrap}
.tool-hero .big-ico{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:0 0 auto}
.tool-hero h1{font-size:30px;font-weight:800}
.tool-hero p{color:var(--text-secondary);margin-top:7px;font-size:15.5px;max-width:720px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:750;padding:4px 10px;border-radius:999px;
  background:#EFF5FF;color:var(--primary);text-transform:uppercase;letter-spacing:.05em}
.pill.ready{background:#E4F6EF;color:#0E7A57}
.pill.warn{background:#FEF3E2;color:#B45309}
.workspace{background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:24px;box-shadow:var(--shadow);margin-bottom:28px}
.ws-title{font-size:17px;font-weight:750;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.ws-title .bar{width:4px;height:18px;border-radius:3px;background:var(--primary)}
.tz-field{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:650;color:var(--text-primary)}
.tz-label{color:var(--text-secondary);font-size:12.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.tz-input{padding:10px 13px;border:1px solid var(--border);border-radius:10px;font-size:14.5px;font-family:inherit;
  background:#F9FBFF;outline:none;color:var(--text-primary);width:100%}
.tz-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(52,120,246,.12)}
.tz-area{resize:vertical;min-height:140px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.6}
.tz-file{padding:9px;background:#F9FBFF;cursor:pointer}
.tz-color{padding:4px;height:44px;cursor:pointer}
.tz-check{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--text-primary)}
.tz-check input{width:17px;height:17px;accent-color:var(--primary)}
.tz-out{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:#F6FAFF;border:1px solid var(--border);border-radius:12px;padding:14px}
.stat-v{font-size:22px;font-weight:800;color:var(--primary);word-break:break-word;line-height:1.25}
.stat-l{font-size:12.5px;color:var(--text-secondary);font-weight:650;margin-top:3px}
.out-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:-4px}
.out-title{font-size:12.5px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary)}
.tz-pre{background:#0F172A;color:#E2E8F4;border-radius:12px;padding:16px;overflow:auto;font-size:13px;line-height:1.65;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:460px;white-space:pre-wrap;word-break:break-word;margin:0}
.tz-status{font-size:14px;color:var(--text-secondary);padding:8px 0}
.alert{border-radius:12px;padding:14px 16px;font-size:14px;display:flex;gap:11px;align-items:flex-start}
.alert.err{background:#FEF2F2;border:1px solid #FBD5D5;color:#9B1C1C}
.alert.warn{background:#FFFBEB;border:1px solid #FCE7B5;color:#92400E}
.alert.info{background:#EFF6FF;border:1px solid #C9DEFB;color:#1E40AF}
.alert.ok{background:#ECFDF5;border:1px solid #BBF0DA;color:#065F46}
.mini-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.mini-item{background:#F6FAFF;border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:13px;display:flex;justify-content:space-between;gap:10px}
.img-item{background:#F9FBFF;border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.img-item canvas{max-width:220px;max-height:200px;border-radius:9px;border:1px solid var(--border);background:#fff}
.swatch{width:100%;height:90px;border-radius:12px;border:1px solid var(--border)}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.keypad button{padding:14px 6px;border-radius:11px;border:1px solid var(--border);background:#fff;font-weight:650;font-size:15px}
.keypad button:hover{background:#EFF5FF;border-color:var(--primary);color:var(--primary)}
.keypad button.op{background:#F3F0FF;color:var(--accent);border-color:#E2DBFF}
.keypad button.eq{background:var(--primary);color:#fff;border-color:var(--primary)}
.keypad button.eq:hover{background:var(--primary-hover);color:#fff}
.kp-display{background:#0F172A;color:#fff;border-radius:12px;padding:16px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:22px;text-align:right;word-break:break-all;min-height:60px}
.info-grid{display:grid;grid-template-columns:1.35fr .9fr;gap:26px;align-items:start}
.info-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:22px;box-shadow:var(--shadow-sm);margin-bottom:18px}
.info-card h3{font-size:16px;font-weight:750;margin-bottom:12px}
.info-card ul{margin:0;padding-left:19px;color:var(--text-secondary);font-size:14.3px}
.info-card li{margin-bottom:7px}
.rel-list{display:flex;flex-direction:column;gap:9px}
.rel-item{display:flex;gap:11px;align-items:center;padding:10px;border-radius:11px;border:1px solid var(--border);background:#FBFDFF}
.rel-item:hover{border-color:var(--primary);background:#F3F8FF}
.rel-item .ri{width:34px;height:34px;border-radius:9px;background:#EFF5FF;display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.rel-item .rn{font-size:13.8px;font-weight:650}

/* ---------- MISC ---------- */
.notfound{text-align:center;padding:90px 20px}
.notfound h1{font-size:64px;color:var(--primary);font-weight:800}
.notfound p{color:var(--text-secondary);margin:12px 0 24px}
.loading{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:11px 18px;
  border-radius:11px;font-size:14px;z-index:300;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}

<script>
"use strict";
/* =========================================================================
   TOOLSZENIX — single-file tools platform
   Sections: 1) helpers 2) data 3) validation 4) workspaces 5) views 6) router
   ========================================================================= */

/* ---------------------------- 1. HELPERS ------------------------------- */
const $ = (s, r) => (r || document).querySelector(s);

function el(tag, props) {
  const n = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (let i = 2; i < arguments.length; i++) {
    const kid = arguments[i];
    if (kid == null || kid === false) continue;
    if (Array.isArray(kid)) kid.forEach(x => { if (x != null) n.appendChild(typeof x === "string" ? document.createTextNode(x) : x); });
    else n.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return n;
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 1900);
}

function fmtNum(n) {
  if (typeof n !== "number" || !isFinite(n)) return String(n);
  if (Number.isInteger(n)) return n.toLocaleString("en-US");
  const r = Math.round(n * 1e6) / 1e6;
  return r.toLocaleString("en-US", { maximumFractionDigits: 6 });
}
function round(n, d) { const p = Math.pow(10, d == null ? 2 : d); return Math.round(n * p) / p; }

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((res, rej) => {
    const ta = el("textarea", { style: "position:fixed;left:-9999px" });
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); res(); } catch (e) { rej(e); }
    ta.remove();
  });
}
function copyBtn(getText, label) {
  const b = el("button", { class: "btn btn-ghost btn-sm", type: "button" }, label || "Copy");
  b.addEventListener("click", async () => {
    try { await copyText(getText()); b.textContent = "Copied!"; }
    catch (e) { b.textContent = "Copy failed"; }
    setTimeout(() => { b.textContent = label || "Copy"; }, 1300);
  });
  return b;
}
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = () => res();
    s.onerror = () => rej(new Error("Failed to load " + src));
    document.head.appendChild(s);
  });
}

/* ---------- field factories ---------- */
function labeled(txt, control) {
  return el("label", { class: "tz-field" }, el("span", { class: "tz-label", text: txt }), control);
}
const F = {
  text(label, o) {
    o = o || {};
    const i = el("input", { class: "tz-input", type: o.type || "text", placeholder: o.placeholder || "" });
    if (o.value != null) i.value = o.value;
    return { el: labeled(label, i), input: i, value: () => i.value, set: v => { i.value = v; } };
  },
  num(label, o) {
    o = o || {};
    const i = el("input", { class: "tz-input", type: "number", step: o.step || "any", placeholder: o.placeholder || "" });
    if (o.value != null) i.value = o.value;
    if (o.min != null) i.min = o.min;
    if (o.max != null) i.max = o.max;
    return { el: labeled(label, i), input: i, value: () => (i.value === "" ? "" : Number(i.value)), set: v => { i.value = v; } };
  },
  date(label, o) {
    o = o || {};
    const i = el("input", { class: "tz-input", type: "date" });
    if (o.value) i.value = o.value;
    return { el: labeled(label, i), input: i, value: () => i.value, set: v => { i.value = v; } };
  },
  area(label, o) {
    o = o || {};
    const i = el("textarea", { class: "tz-input tz-area", rows: o.rows || 8, placeholder: o.placeholder || "" });
    if (o.value != null) i.value = o.value;
    return { el: labeled(label, i), input: i, value: () => i.value, set: v => { i.value = v; } };
  },
  sel(label, options, o) {
    o = o || {};
    const s = el("select", { class: "tz-input" });
    (options || []).forEach(op => {
      const val = typeof op === "object" ? op.value : op;
      const lab = typeof op === "object" ? op.label : op;
      s.appendChild(el("option", { value: val, text: lab }));
    });
    if (o.value != null) s.value = o.value;
    return { el: labeled(label, s), input: s, value: () => s.value, set: v => { s.value = v; } };
  },
  file(label, accept, multiple) {
    const i = el("input", { class: "tz-input tz-file", type: "file", accept: accept || "" });
    if (multiple) i.multiple = true;
    return { el: labeled(label, i), input: i, files: () => Array.from(i.files || []), value: () => i.value };
  },
  color(label, def) {
    const i = el("input", { class: "tz-input tz-color", type: "color", value: def || "#3478F6" });
    return { el: labeled(label, i), input: i, value: () => i.value, set: v => { i.value = v; } };
  },
  check(label, checked) {
    const i = el("input", { type: "checkbox" });
    i.checked = !!checked;
    return { el: el("label", { class: "tz-check" }, i, el("span", { text: label })), input: i, value: () => i.checked };
  }
};
function makeField(f) {
  if (f.t === "num") return F.num(f.label, f);
  if (f.t === "sel") return F.sel(f.label, f.options, f);
  if (f.t === "date") return F.date(f.label, f);
  if (f.t === "area") return F.area(f.label, f);
  if (f.t === "color") return F.color(f.label, f.def);
  if (f.t === "check") return F.check(f.label, f.value);
  return F.text(f.label, f);
}
function actionBtn(label, fn, cls, id) {
  const b = el("button", { class: "btn " + (cls || "btn-primary"), type: "button", id: id || null }, label);
  b.addEventListener("click", fn);
  return b;
}

/* ---------- output rendering ---------- */
function renderErr(box, msg) {
  box.innerHTML = "";
  box.appendChild(el("div", { class: "alert err" }, el("span", { text: "⚠" }), el("span", { text: msg })));
}
function renderInfo(box, msg, kind) {
  box.innerHTML = "";
  box.appendChild(el("div", { class: "alert " + (kind || "info") }, el("span", { text: "ℹ" }), el("span", { text: msg })));
}
function renderOut(box, res) {
  box.innerHTML = "";
  if (res == null) return;
  if (typeof res === "string") { if (!res) return; const p = el("pre", { class: "tz-pre" }); p.textContent = res; box.appendChild(p); return; }
  if (res.error) { renderErr(box, res.error); return; }
  if (res.stats && res.stats.length) {
    const g = el("div", { class: "stat-grid" });
    res.stats.forEach(s => {
      const label = Array.isArray(s) ? s[0] : s.label;
      const value = Array.isArray(s) ? s[1] : s.value;
      g.appendChild(el("div", { class: "stat" }, el("div", { class: "stat-v", text: String(value) }), el("div", { class: "stat-l", text: String(label) })));
    });
    box.appendChild(g);
  }
  if (res.text != null && res.text !== "") {
    box.appendChild(el("div", { class: "out-head" },
      el("span", { class: "out-title", text: res.textLabel || "Output" }),
      copyBtn(() => res.text)));
    const p = el("pre", { class: "tz-pre" }); p.textContent = res.text; box.appendChild(p);
  }
  if (res.node) box.appendChild(res.node);
}
function renderImageItems(box, items) {
  items.forEach((it, idx) => {
    const wrap = el("div", { class: "img-item" });
    wrap.appendChild(it.canvas);
    const meta = el("div", { class: "stack", style: "flex:1;min-width:180px" });
    meta.appendChild(el("div", { style: "font-weight:700;font-size:14px", text: it.filename }));
    meta.appendChild(el("div", { class: "small muted", text: it.canvas.width + " × " + it.canvas.height + " px" }));
    const dl = actionBtn("Download", () => {
      it.canvas.toBlob(b => {
        if (!b) { toast("Export failed in this browser."); return; }
        download(b, it.filename);
      }, it.type || "image/png", it.quality == null ? 0.92 : it.quality);
    }, "btn-primary btn-sm");
    meta.appendChild(dl);
    wrap.appendChild(meta);
    box.appendChild(wrap);
  });
}

  const wrap = el("div", { class: "accordion" });
  items.forEach(pair => {
    const body = el("div", { class: "acc-body" }, el("p", { text: pair[1] }));
    const ico = el("span", { class: "acc-ico", text: "+" });
    const head = el("button", { class: "acc-head", type: "button", "aria-expanded": "false" },
      el("span", { text: pair[0] }), ico);
    const item = el("div", { class: "acc-item" }, head, body);
    head.addEventListener("click", () => {
      const open = item.classList.toggle("open");
      head.setAttribute("aria-expanded", open ? "true" : "false");

    wrap.appendChild(item);
  });
  return wrap;
}

/* ------------------------ 3. DATA VALIDATION ---------------------------- */
function validateCatalog() {
  const problems = [];
  if (TOOLS.length !== 240) problems.push("Expected 240 tools, found " + TOOLS.length + ".");
  const seen = new Set();
  TOOLS.forEach(t => {
    if (seen.has(t.id)) problems.push("Duplicate tool id: " + t.id);
    seen.add(t.id);
    if (!CATEGORY_BY_NAME[t.category]) problems.push("Unknown category for " + t.id);
    if (["browser", "library", "external", "integration-required"].indexOf(t.implementation) === -1)
      problems.push("Invalid implementation type for " + t.id);
    if (t.implementation === "external" && t.url && !/^https?:\/\//i.test(t.url))
      problems.push("Unsafe external URL for " + t.id);
  });
  CATEGORIES.forEach(c => {
    const n = TOOLS.filter(t => t.categoryId === c.id).length;
    if (n !== 20) problems.push("Category '" + c.name + "' has " + n + " tools (expected 20).");
  });
  const featured = TOOLS.filter(t => t.featured).length;
  if (featured !== 20) problems.push("Expected 20 featured tools, found " + featured + ".");
  if (problems.length) console.warn("[Toolszenix] Data validation warnings:\n" + problems.join("\n"));
  return problems;
}

function fileBuf(file) { return file.arrayBuffer().then(b => new Uint8Array(b)); }
function parseRanges(str, max) {
  const out = [];
  String(str).split(",").forEach(part => {
    const p = part.trim(); if (!p) return;
    const m = p.match(/^(\d+)\s*-\s*(\d+)$/);
    if (m) { let a = +m[1], b = +m[2]; if (a > b) { const t = a; a = b; b = t; } for (let i = a; i <= b; i++) out.push(i); }
    else if (/^\d+$/.test(p)) out.push(+p);
  });
  const clean = out.filter(n => n >= 1 && n <= max);
  if (!clean.length) throw new Error("Enter page numbers such as 1,3 or 2-5 (document has " + max + " pages).");
  return clean;
}

}

  "age-calculator": {

  "time-duration-calculator": {

      const sum = parts.reduce((a, b) => a + b, 0);

      return { stats: [["Average (mean)", round(sum / parts.length, 4)], ["Sum", round(sum, 4)], ["Count", parts.length], ["Median", median], ["Minimum", sorted[0]], ["Maximum", sorted[sorted.length - 1]]] };

  "ratio-calculator": {

      const g = gcd(Math.abs(a), Math.abs(b));
      return { stats: [["Simplified A : B", (a / g) + " : " + (b / g)], ["A : B as decimal", round(a / b, 6)], ["D when A:B = C:D", round(c * b / a, 6)]] };

  "fraction-calculator": {
    fields: [{ t: "num", key: "n1", label: "First numerator", value: 1, step: 1 }, { t: "num", key: "d1", label: "First denominator", value: 2, step: 1 }, { t: "sel", key: "op", label: "Operation", options: ["+", "-", "×", "÷"] }, { t: "num", key: "n2", label: "Second numerator", value: 1, step: 1 }, { t: "num", key: "d2", label: "Second denominator", value: 3, step: 1 }],
    compute: v => {
      const n1 = num(v.n1, "numerator"), d1 = num(v.d1, "denominator"), n2 = num(v.n2, "numerator"), d2 = num(v.d2, "denominator");
      if (!d1 || !d2) throw new Error("Denominators must not be zero.");
      let n, d;
      if (v.op === "+") { n = n1 * d2 + n2 * d1; d = d1 * d2; }
      else if (v.op === "-") { n = n1 * d2 - n2 * d1; d = d1 * d2; }
      else if (v.op === "×") { n = n1 * n2; d = d1 * d2; }
      else { if (n2 === 0) throw new Error("Cannot divide by zero."); n = n1 * d2; d = d1 * n2; }
      const g = gcd(Math.abs(n), Math.abs(d)) || 1;
      return { stats: [["Result", (n / g) + " / " + (d / g)], ["Decimal", round(n / d, 6)], ["Unsimplified", n + " / " + d]] };
    }
  },

  "attendance-calculator": {

  "study-timetable-generator": {
    fields: [{ t: "area", key: "subjects", label: "Subjects (one per line)", value: "Mathematics\nPhysics\nChemistry\nEnglish", rows: 5 }, { t: "num", key: "hours", label: "Study hours per day", value: 4 }, { t: "sel", key: "start", label: "Start time", options: ["06:00", "07:00", "08:00", "09:00", "16:00", "17:00", "18:00", "19:00"] }],
    compute: v => {
      const subs = String(v.subjects).split("\n").map(s => s.trim()).filter(Boolean);

      const hours = num(v.hours, "study hours");

      const startH = Number(v.start.split(":")[0]), startM = Number(v.start.split(":")[1]);
      const slot = hours / Math.min(subs.length, 4);
      let out = "";
      days.forEach((d, di) => {
        out += d + "\n";
        for (let i = 0; i < Math.min(subs.length, 4); i++) {
          const sub = subs[(di + i) % subs.length];
          const s = startH + Math.floor(i * slot);
          const m = Math.round(startM + (i * slot % 1) * 60);
          const e = s + Math.floor(slot);
          const em = Math.round(m + (slot % 1) * 60);
          out += "  " + String(s).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0") + " – " +
            String(e).padStart(2, "0") + ":" + String(em % 60).padStart(2, "0") + "  " + sub + "\n";
        }
        out += "\n";
      });
      return { text: out.trim(), textLabel: "Weekly timetable", stats: [["Subjects", subs.length], ["Hours per day", hours], ["Total weekly hours", hours * 7]] };
    }
  },

  "revision-planner": {
    fields: [{ t: "area", key: "topics", label: "Topics (one per line)", value: "Algebra\nTrigonometry\nOrganic Chemistry\nEssay Writing", rows: 6 }, { t: "date", key: "exam", label: "Exam date", value: todayISO() }, { t: "num", key: "perDay", label: "Topics per day", value: 2, step: 1 }],
    compute: v => {
      const topics = String(v.topics).split("\n").map(s => s.trim()).filter(Boolean);
      if (!topics.length) throw new Error("Enter at least one topic.");
      if (!v.exam) throw new Error("Choose the exam date.");
      const per = Math.max(1, parseInt(v.perDay) || 1);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const exam = new Date(v.exam + "T00:00:00");
      const days = Math.round((exam - today) / 86400000);
      if (days <= 0) throw new Error("The exam date must be in the future.");
      let out = "", idx = 0, d = new Date(today);
      while (idx < topics.length && d < exam) {
        d.setDate(d.getDate() + 1);
        if (d >= exam) break;

/* Study session timer / Pomodoro / countdown timers */
function timerEngine(cfg) {
  return function (root) {
    const mins = F.num("Minutes", { value: cfg.defaultMin || 25, min: 1, max: 600, step: 1 });
    const secs = F.num("Extra seconds", { value: 0, min: 0, max: 59, step: 1 });
    const display = el("div", { class: "kp-display", text: "25:00" });
    const status = el("div", { class: "tz-status" });
    let remaining = 0, timer = null, endAt = 0;
    function fmt(ms) {
      const total = Math.max(0, Math.ceil(ms / 1000));
      const m = Math.floor(total / 60), s = total % 60;
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }
    function paint() { display.textContent = fmt(remaining); }
    function tick() {
      remaining = endAt - Date.now();
      if (remaining <= 0) { remaining = 0; paint(); stop(); beep(); status.textContent = "Time is up!"; return; }
      paint();
    }
    function start() {
      if (timer) return;
      const total = (Number(mins.value()) || 0) * 60000 + (Number(secs.value()) || 0) * 1000;
      if (total <= 0) { status.textContent = "Enter a duration greater than zero."; return; }
      if (remaining <= 0) remaining = total;
      endAt = Date.now() + remaining;
      timer = setInterval(tick, 200);
      status.textContent = "Running…";
    }
    function stop() { if (timer) { clearInterval(timer); timer = null; } }
    function reset() { stop(); remaining = 0; display.textContent = fmt(((Number(mins.value()) || 0) * 60000 + (Number(secs.value()) || 0) * 1000)); status.textContent = "Ready."; }
    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; g.gain.value = 0.15;
        o.start(); setTimeout(() => { o.stop(); ctx.close(); }, 700);
      } catch (e) { /* audio may be blocked; visual alert still shows */ }
    }
    reset();
    root.appendChild(el("div", { class: "stack" },
      display,
      el("div", { class: "grid-2" }, mins.el, secs.el),
      el("div", { class: "row" }, actionBtn("Start", start), actionBtn("Pause", stop, "btn-ghost"), actionBtn("Reset", reset, "btn-ghost")),
      status));
  };
}

WORKSPACES["pomodoro-timer"] = function (root) {
  const work = F.num("Focus minutes", { value: 25, min: 1, max: 120, step: 1 });
  const brk = F.num("Break minutes", { value: 5, min: 1, max: 60, step: 1 });
  const display = el("div", { class: "kp-display", text: "25:00" });
  const status = el("div", { class: "tz-status", text: "Ready to focus." });
  const cycleInfo = el("div", { class: "small muted", text: "Completed focus sessions: 0" });
  let timer = null, endAt = 0, onBreak = false, done = 0;
  function paint() { const t = Math.max(0, Math.ceil((endAt - Date.now()) / 1000)); display.textContent = String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); }
  function begin() {
    const mins = onBreak ? (Number(brk.value()) || 5) : (Number(work.value()) || 25);
    endAt = Date.now() + mins * 60000;
    status.textContent = onBreak ? "Break time." : "Focus time.";
    if (timer) clearInterval(timer);
    timer = setInterval(() => {
      paint();
      if (Date.now() >= endAt) {
        clearInterval(timer); timer = null;
        if (!onBreak) { done++; cycleInfo.textContent = "Completed focus sessions: " + done; }
        onBreak = !onBreak;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination); o.frequency.value = 660; g.gain.value = .15;
          o.start(); setTimeout(() => { o.stop(); ctx.close(); }, 600);
        } catch (e) { }
        begin();
      }
    }, 200);
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; status.textContent = "Paused."; } }
  function reset() { stop(); onBreak = false; done = 0; cycleInfo.textContent = "Completed focus sessions: 0"; display.textContent = "00:00"; status.textContent = "Reset."; }
  root.appendChild(el("div", { class: "stack" }, display,
    el("div", { class: "grid-2" }, work.el, brk.el),
    el("div", { class: "row" }, actionBtn("Start", begin), actionBtn("Pause", stop, "btn-ghost"), actionBtn("Reset", reset, "btn-ghost")),
    status, cycleInfo));
};

WORKSPACES["stopwatch"] = function (root) {
  const display = el("div", { class: "kp-display", text: "00:00.00" });
  const laps = el("div", { class: "mini-list" });
  let running = false, startTs = 0, elapsed = 0, timer = null, lapCount = 0;
  function fmt(ms) {
    const total = Math.floor(ms);
    const m = Math.floor(total / 60000), s = Math.floor(total % 60000 / 1000), cs = Math.floor(total % 1000 / 10);
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") + "." + String(cs).padStart(2, "0");
  }
  function paint() { display.textContent = fmt(elapsed + (running ? Date.now() - startTs : 0)); }
  function start() { if (running) return; running = true; startTs = Date.now(); timer = setInterval(paint, 31); }
  function stop() { if (!running) return; elapsed += Date.now() - startTs; running = false; clearInterval(timer); timer = null; paint(); }
  function reset() { stop(); elapsed = 0; lapCount = 0; laps.innerHTML = ""; paint(); }
  function lap() {
    if (!running && elapsed === 0) return;
    lapCount++;
    const t = elapsed + (running ? Date.now() - startTs : 0);
    laps.appendChild(el("div", { class: "mini-item" }, el("span", { text: "Lap " + lapCount }), el("span", { text: fmt(t) })));
  }
  root.appendChild(el("div", { class: "stack" }, display,
    el("div", { class: "row" }, actionBtn("Start", start), actionBtn("Stop", stop, "btn-ghost"), actionBtn("Lap", lap, "btn-soft"), actionBtn("Reset", reset, "btn-ghost")), laps));
};

/* Expression evaluator */
const MATH_FNS = { sqrt: Math.sqrt, sin: Math.sin, cos: Math.cos, tan: Math.tan, log: Math.log10, ln: Math.log, abs: Math.abs, exp: Math.exp, round: Math.round, floor: Math.floor, ceil: Math.ceil };
function evalExpr(src) {
  const s = String(src).replace(/\s+/g, "").replace(/\*\*/g, "^");
  if (!s) throw new Error("Enter an expression first.");
  const raw = s.match(/[A-Za-z]+|\d*\.?\d+|[-+*/^%()]/g) || [];
  if (!raw.length) throw new Error("Enter a valid expression.");
  const out = [], ops = [];
  const prec = { "+": 1, "-": 1, "*": 2, "/": 2, "%": 2, "^": 4, "u": 3 };
  const rightAssoc = { "^": true, "u": true };
  let prev = null;
  for (let i = 0; i < raw.length; i++) {
    const tk = raw[i];
    if (/^(\d|\.\d)/.test(tk)) out.push(parseFloat(tk));
    else if (/^[A-Za-z]/.test(tk)) {
      const name = tk.toLowerCase();
      if (name === "pi") out.push(Math.PI);
      else if (name === "e" && raw[i + 1] !== "(") out.push(Math.E);
      else if (MATH_FNS[name]) ops.push(name);
      else throw new Error("Unknown name: " + tk);
    }
    else if (tk === "(") ops.push("(");
    else if (tk === ")") {
      while (ops.length && ops[ops.length - 1] !== "(") out.push(ops.pop());
      if (!ops.length) throw new Error("Mismatched brackets.");
      ops.pop();
      if (ops.length && MATH_FNS[ops[ops.length - 1]]) out.push(ops.pop());
    }
    else if (tk === "-" && (prev === null || prev === "(" || prec[prev] !== undefined)) ops.push("u");
    else {
      while (ops.length) {
        const top = ops[ops.length - 1];
        if (top === "(" || MATH_FNS[top]) break;
        if (prec[top] > prec[tk] || (prec[top] === prec[tk] && !rightAssoc[tk])) out.push(ops.pop());
        else break;
      }
      ops.push(tk);
    }
    prev = tk;
  }
  while (ops.length) { const o = ops.pop(); if (o === "(") throw new Error("Mismatched brackets."); out.push(o); }
  const st = [];
  for (let i = 0; i < out.length; i++) {
    const t = out[i];
    if (typeof t === "number") st.push(t);
    else if (t === "u") { if (!st.length) throw new Error("Invalid expression."); st.push(-st.pop()); }
    else if (MATH_FNS[t]) { if (!st.length) throw new Error("Invalid expression."); st.push(MATH_FNS[t](st.pop())); }
    else {
      const b = st.pop(), a = st.pop();
      if (a === undefined || b === undefined) throw new Error("Invalid expression.");
      if (t === "/" && b === 0) throw new Error("Division by zero.");
      st.push(t === "+" ? a + b : t === "-" ? a - b : t === "*" ? a * b : t === "/" ? a / b : t === "%" ? a % b : Math.pow(a, b));
    }
  }
  if (st.length !== 1) throw new Error("Invalid expression.");
  const r = st[0];
  if (!isFinite(r)) throw new Error("The result is not a finite number.");
  return r;
}

const ONES = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
const TENS = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
function numberToWords(n) {
  if (n === 0) return "zero";
  if (n < 0) return "minus " + numberToWords(-n);
  if (n < 20) return ONES[n];
  if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? "-" + ONES[n % 10] : "");
  if (n < 1000) return ONES[Math.floor(n / 100)] + " hundred" + (n % 100 ? " and " + numberToWords(n % 100) : "");
  const scales = [[1e12, "trillion"], [1e9, "billion"], [1e6, "million"], [1e3, "thousand"]];
  for (let i = 0; i < scales.length; i++) {
    if (n >= scales[i][0]) {
      const q = Math.floor(n / scales[i][0]);
      return numberToWords(q) + " " + scales[i][1] + (n % scales[i][0] ? " " + numberToWords(n % scales[i][0]) : "");
    }
  }
  return String(n);
}

const WORD_NUMS = { zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19, twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90 };
WORKSPACES["words-to-number"] = function (root) {

    if (!words.length) throw new Error("Enter number words.");
    let total = 0, current = 0, neg = false;
    const scales = { thousand: 1e3, million: 1e6, billion: 1e9, trillion: 1e12 };
    words.forEach(w => {

      if (scales[w]) { total += (current || 1) * scales[w]; current = 0; return; }

/* ---------- 4d. IMAGE TOOLS ---------- */
function makeCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
  return c;
}
function loadImageFile(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { res({ img: img, url: url }); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("This image could not be decoded in your browser. If it is a HEIC or RAW file, convert it first.")); };
    img.src = url;
  });
}
function drawImageTo(img, w, h) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function baseName(file) { return (file.name || "image").replace(/\.[^.]+$/, ""); }

function buildIco(canvas) {
  const png = canvas.toDataURL("image/png");
  const bin = atob(png.split(",")[1]);
  const size = canvas.width;
  const header = new Uint8Array(6 + 16);
  const dv = new DataView(header.buffer);
  dv.setUint16(0, 0, true); dv.setUint16(2, 1, true); dv.setUint16(4, 1, true);
  header[6] = size >= 256 ? 0 : size; header[7] = size >= 256 ? 0 : size;
  header[8] = 0; header[9] = 0;
  dv.setUint16(10, 1, true); dv.setUint16(12, 32, true);
  dv.setUint32(14, bin.length, true); dv.setUint32(18, 22, true);
  const out = new Uint8Array(22 + bin.length);
  out.set(header, 0);
  for (let i = 0; i < bin.length; i++) out[22 + i] = bin.charCodeAt(i);
  return out;
}

  const size = F.num("Font size (pt)", { value: 16, min: 4 });

      const row = el("div", { class: "mini-item" },

      annotations.push({ page: p, text: text.value(), x: Number(x.value()) || 0, yTop: Number(yTop.value()) || 0, size: Number(size.value()) || 16, colour: colour.value(), box: boxBehind.value() });

          const pg = pages[a.page - 1];

    const out = el("div", { class: "tz-out" });
    root.appendChild(el("div", { class: "stack" }, file.el,
      el("div", { class: "grid-2" }, pageSize.el),
      el("div", { class: "row" }, actionBtn("Create PDF", async function () {
        const files = file.files();
        out.innerHTML = "";
        if (!files.length) { renderErr(out, "Choose at least one image."); return; }
        const self = this; self.disabled = true; const orig = self.textContent; self.innerHTML = '<span class="loading"></span> Building…';
        try {
          const PL = await needPdfLib();
          const doc = await PL.PDFDocument.create();
          for (const f of files) {
            const buf = await fileBuf(f);
            let img;
            if (/png$/i.test(f.type) || /\.png$/i.test(f.name)) img = await doc.embedPng(buf);
            else img = await doc.embedJpg(buf);
            const mode = pageSize.value();
            if (mode === "fit") {
              const pg = doc.addPage([img.width, img.height]);
              pg.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
            } else {
              const dims = mode === "a4" ? [595.28, 841.89] : [612, 792];
              const pg = doc.addPage(dims);
              const scale = Math.min(dims[0] / img.width, dims[1] / img.height);
              const w = img.width * scale, h = img.height * scale;
              pg.drawImage(img, { x: (dims[0] - w) / 2, y: (dims[1] - h) / 2, width: w, height: h });
            }
          }
          const bytes = await doc.save();
          out.appendChild(actionBtn("Download PDF", () => download(new Blob([bytes], { type: "application/pdf" }), "images.pdf"), "btn-primary"));
          renderInfo(out, "Created a PDF with " + files.length + " page(s).", "ok");
        } catch (e) { renderErr(out, e.message); }
        finally { self.disabled = false; self.textContent = orig; }
      })), out));
  };
}

WORKSPACES["subtitle-formatter"] = function (root) {
  const rows = F.area("One subtitle line per line", { rows: 9, placeholder: "Hello and welcome\nToday we build a tool" });
  const format = F.sel("Output format", [{ value: "srt", label: "SRT" }, { value: "vtt", label: "WebVTT" }, { value: "plain", label: "Plain numbered list" }]);
  const seconds = F.num("Seconds per line", { value: 3, min: 0.5, step: 0.5 });
  const out = el("div", { class: "tz-out" });
  function pad(n, w) { return String(n).padStart(w || 2, "0"); }
  function ts(total, useComma) {
    const ms = Math.round((total % 1) * 1000);
    const s = Math.floor(total) % 60;
    const m = Math.floor(total / 60) % 60;
    const h = Math.floor(total / 3600);
    return pad(h) + ":" + pad(m) + ":" + pad(s) + (useComma ? "," : ".") + pad(ms, 3);
  }
  function run() {
    const lines = String(rows.value()).split("\n").map(l => l.trim()).filter(Boolean);
    if (!lines.length) { renderOut(out, ""); return; }
    const per = Math.max(0.5, Number(seconds.value()) || 3);

    lines.forEach((l, i) => {
      const start = i * per, end = start + per;
      if (format.value() === "plain") text += (i + 1) + ". " + l + "\n";
      else text += (i + 1) + "\n" + ts(start, format.value() === "srt") + " --> " + ts(end, format.value() === "srt") + "\n" + l + "\n\n";
    });
    renderOut(out, { text: text.trim(), textLabel: format.value().toUpperCase(), stats: [["Cues", lines.length], ["Total duration", lines.length * per + " s"]] });

WORKSPACES["career-goal-planner"] = function (root) {
  const goal = F.text("Career goal", { placeholder: "Become a frontend developer" });

  const months = F.num("Number of milestones", { value: 4, min: 1, max: 12, step: 1 });
  const out = el("div", { class: "tz-out" });
  function run() {
    if (!goal.value().trim()) { renderOut(out, ""); return; }
    if (!deadline.value()) { renderOut(out, ""); return; }
    const n = Math.min(12, Math.max(1, parseInt(months.value()) || 4));
    const end = new Date(deadline.value() + "T00:00:00");
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const span = Math.max(1, Math.round((end - today) / 86400000));
    const STEP_NAMES = ["Learn the fundamentals", "Build a small project", "Practise interview questions", "Get feedback and improve", "Apply to opportunities", "Deepen one specialism", "Build a portfolio piece", "Network with people in the field", "Refine your resume", "Prepare for interviews", "Review and adjust the plan", "Final push before the deadline"];

      const d = new Date(today); d.setDate(d.getDate() + dayOffset);
      text += "Milestone " + (i + 1) + " — " + d.toISOString().slice(0, 10) + "\n  " + STEP_NAMES[i % STEP_NAMES.length] + "\n\n";

function codeOutputEngine(cfg) {

    run();
  };
}
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function validUrl(s) { try { const u = new URL(s); return u.protocol === "http:" || u.protocol === "https:"; } catch (e) { return false; } }

  const related = TOOLS.filter(t => t.categoryId === tool.categoryId && t.id !== tool.id).slice(0, 5);
  const infoGrid = el("div", { class: "wrap" },

        el("div", { class: "info-card" },

          ]))),
      el("div", {},
        el("div", { class: "info-card" },
          el("h3", { text: "Related tools" }),
          el("div", { class: "rel-list" }, related.map(r => el("a", { class: "rel-item", href: "#/tool/" + r.id },
            el("span", { class: "ri", text: r.icon }),
            el("span", {}, el("div", { class: "rn", text: r.name }), el("div", { class: "small muted", text: r.category }))))),

        el("div", { class: "info-card" },
          el("h3", { text: "Category" }),
          el("p", { text: cat.desc }),
          el("div", { style: "margin-top:12px" }, el("a", { class: "btn btn-ghost btn-sm", href: "#/category/" + cat.id, text: "Explore " + cat.name }))))));
  frag.appendChild(infoGrid);
  return frag;
}

/* ---------------------------- 6. ROUTER --------------------------------- */
function setTitle(text) {
  document.title = text ? text + " — Toolszenix" : "Toolszenix — All-in-One Free Online Tools for Daily Use";
}
function route() {
  const hash = location.hash || "#/";
  const app = $("#main");
  app.innerHTML = "";

  let view = null;
  let title = "";

  if (hash === "#/" || hash === "#") {
    view = homeView();
  } else if (hash.indexOf("#/all-tools") === 0) {
    const qIdx = hash.indexOf("?");
    if (qIdx > -1) { const params = new URLSearchParams(hash.slice(qIdx + 1)); if (params.get("q")) pendingSearch = params.get("q"); }
    view = allToolsView();
    title = "All Tools";
  } else if (hash.indexOf("#/category/") === 0) {
    const id = hash.slice("#/category/".length).split("?")[0];
    const cat = CATEGORY_BY_ID[id];
    view = categoryView(id);
    title = cat ? cat.name : "Category not found";
  } else if (hash.indexOf("#/tool/") === 0) {
    const id = hash.slice("#/tool/".length).split("?")[0];
    const tool = TOOLS_BY_ID[id];
    view = toolView(id);
    title = tool ? tool.name : "Tool not found";
  } else if (hash.indexOf("#/about") === 0) { view = staticView("about"); title = "About Us"; }
  else if (hash.indexOf("#/contact") === 0) { view = staticView("contact"); title = "Contact"; }
  else if (hash.indexOf("#/privacy") === 0) { view = staticView("privacy"); title = "Privacy Policy"; }
  else if (hash.indexOf("#/terms") === 0) { view = staticView("terms"); title = "Terms and Conditions"; }
  else if (hash.indexOf("#/disclaimer") === 0) { view = staticView("disclaimer"); title = "Disclaimer"; }
  else { view = notFoundView(); title = "Page not found"; }

  app.appendChild(view);
  setTitle(title);

  /* update active nav link */
  const navKey = hash === "#/" || hash === "#" ? "home" : hash.indexOf("#/all-tools") === 0 || hash.indexOf("#/category/") === 0 || hash.indexOf("#/tool/") === 0 ? "all" : "";
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("active", a.getAttribute("data-nav") === navKey));
  const panel = $("#mobilePanel");
  if (panel) panel.classList.remove("open");

  window.scrollTo({ top: 0, behavior: "auto" });
}
window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", function () {
  const problems = validateCatalog();
  renderNav();
  renderFooter();
  route();
  if (problems.length) {
    console.warn("[Toolszenix] Catalog validation reported " + problems.length + " issue(s). See the warnings above.");
  }
  console.log("[Toolszenix] Ready — " + TOOLS.length + " tools registered across " + CATEGORIES.length + " categories. Featured on homepage: " + TOOLS.filter(t => t.featured).length + ".");
});
